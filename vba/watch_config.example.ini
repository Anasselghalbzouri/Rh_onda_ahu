; watch_config.example.ini — modèle de configuration du watcher RH ONDA.
;
; 1. Copiez ce fichier en `watch_config.ini` (même dossier).
; 2. Renseignez vos identifiants ci-dessous.
; 3. `watch_config.ini` est ignoré par git (ne pas committer de mot de passe).
;
; Alternative : définir les variables d'environnement RH_MATRICULE, RH_PASSWORD,
; RH_API_URL, RH_EXPORT_INTERVAL_MIN, RH_EXPORT_ENABLED (elles ont priorité).

[rh_onda]
; URL de base de l'API (sans slash final)
api_url = http://127.0.0.1:8000/api

; Identifiants d'un compte RH autorisé au bulk-sync
matricule = 9519
password = VOTRE_MOT_DE_PASSE

; Fichiers à surveiller (true/false)
watch_employes = true
watch_formation = true

; Intervalle (minutes) de régénération de l'instantané plateforme -> Excel
export_interval_min = 10

; Activer/désactiver l'export plateforme -> Excel (true/false)
export_enabled = true
