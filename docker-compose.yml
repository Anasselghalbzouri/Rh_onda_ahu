# Déploiement RH ONDA — plateforme complète (API + front + base) en 2 conteneurs.
# La base SQLite existante (backend/database/database.sqlite) est embarquée telle
# quelle : copiez le dossier du projet sur un autre poste, `docker compose up`,
# et vos données actuelles sont là.
#
#   docker compose up --build      puis ouvrir  http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_NAME: "RH ONDA"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}                 # vient du .env à la racine (clé stable)
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync              # pas de worker séparé : exécution inline
      LOG_CHANNEL: stderr                 # logs visibles via `docker compose logs`
    volumes:
      # Dossier database monté depuis l'hôte : la base existante voyage avec le
      # dossier et les écritures persistent.
      - ./backend/database:/var/www/html/database
    expose:
      - "8000"                            # NON publié (évite le conflit avec un
                                          # `php artisan serve` local sur 8000)
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"                         # http://localhost:8080
    restart: unless-stopped
