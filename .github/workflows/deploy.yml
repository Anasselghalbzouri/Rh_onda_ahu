name: Deploy to Hostinger

# Déclenché à chaque push sur main. Peut aussi être lancé à la main
# (onglet Actions > Deploy to Hostinger > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # ne jamais couper un déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupère le code source
      - uses: actions/checkout@v4

      # 2) Compile les dépendances PHP de production (comme composer install --no-dev)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, mbstring
          tools: composer:v2

      - name: Composer install (prod)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 3) Compile le frontend React (Vite) puis le copie dans backend/public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copie du SPA compilé dans backend/public
        run: cp -r frontend/build/. backend/public/

      # 4) Prépare la clé SSH pour joindre Hostinger
      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # TEMP DEBUG — à retirer une fois DEPLOY_PATH confirmé correct.
      # N'affiche jamais la valeur du secret : GitHub la masque automatiquement
      # (elle apparaîtrait comme ***), donc on vérifie longueur/format à la place,
      # et on teste l'existence du dossier cible + de son parent sur le serveur.
      - name: "[DEBUG] Vérifier DEPLOY_PATH"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "Longueur de DEPLOY_PATH : ${#DEPLOY_PATH}"
          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH est vide ou non défini."
          fi
          case "$DEPLOY_PATH" in
            /*) echo "Commence par / : oui" ;;
            *)  echo "Commence par / : non (chemin relatif — vérifier que c'est voulu)" ;;
          esac
          case "$DEPLOY_PATH" in
            */) echo "Se termine par / : oui" ;;
            *)  echo "Se termine par / : non" ;;
          esac

          ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "DEPLOY_PATH='$DEPLOY_PATH'; \
             if [ -d \"\$DEPLOY_PATH\" ]; then echo 'Dossier cible : existe déjà'; else echo 'Dossier cible : MANQUANT'; fi; \
             PARENT=\$(dirname \"\$DEPLOY_PATH\"); \
             if [ -d \"\$PARENT\" ]; then echo \"Dossier parent (\$PARENT) : existe\"; else echo \"Dossier parent (\$PARENT) : MANQUANT\"; fi"

      # 5) Envoie SEULEMENT le code vers le serveur.
      #    Exclusions critiques : la base SQLite en production, le .env du
      #    serveur (contient l'APP_KEY stable) et storage/ (uploads, sessions,
      #    logs) ne sont JAMAIS écrasés. --delete nettoie le vieux code mais
      #    respecte ces exclusions.
      - name: Déploiement via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }}" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-journal' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # 6) Applique les migrations et recache la config, côté serveur.
      #    migrate --force ne touche qu'au SCHÉMA, jamais aux données.
      - name: Migrations + cache (sur le serveur)
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan migrate --force && \
             php artisan storage:link || true && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache"