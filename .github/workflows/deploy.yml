name: Deploy to Hostinger

# Déclenché à chaque push sur main. Peut aussi être lancé à la main
# (onglet Actions > Deploy to Hostinger > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # ne jamais couper un déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupère le code source
      - uses: actions/checkout@v4

      # 2) Compile les dépendances PHP de production (comme composer install --no-dev)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, mbstring
          tools: composer:v2

      - name: Composer install (prod)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 3) Compile le frontend React (Vite) puis le copie dans backend/public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copie du SPA compilé dans backend/public
        run: cp -r frontend/build/. backend/public/

      # 4) Prépare la clé SSH pour joindre Hostinger
      - name: Configuration SSH
        if: ${{ (secrets.SSH_PRIVATE_KEY != '' || vars.SSH_PRIVATE_KEY != '') && (secrets.SSH_HOST != '' || vars.SSH_HOST != '') && (secrets.SSH_USER != '' || vars.SSH_USER != '') && (secrets.DEPLOY_PATH != '' || vars.DEPLOY_PATH != '') }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déploiement ignoré (configuration SSH manquante)
        if: ${{ !((secrets.SSH_PRIVATE_KEY != '' || vars.SSH_PRIVATE_KEY != '') && (secrets.SSH_HOST != '' || vars.SSH_HOST != '') && (secrets.SSH_USER != '' || vars.SSH_USER != '') && (secrets.DEPLOY_PATH != '' || vars.DEPLOY_PATH != '')) }}
        run: |
          echo "::warning::Déploiement ignoré : configurez SSH_PRIVATE_KEY, SSH_HOST, SSH_USER et DEPLOY_PATH dans les secrets/variables du dépôt."

      # 5) Envoie SEULEMENT le code vers le serveur.
      #    Exclusions critiques : la base SQLite en production, le .env du
      #    serveur (contient l'APP_KEY stable) et storage/ (uploads, sessions,
      #    logs) ne sont JAMAIS écrasés. --delete nettoie le vieux code mais
      #    respecte ces exclusions.
      - name: Déploiement via rsync
        if: ${{ (secrets.SSH_PRIVATE_KEY != '' || vars.SSH_PRIVATE_KEY != '') && (secrets.SSH_HOST != '' || vars.SSH_HOST != '') && (secrets.SSH_USER != '' || vars.SSH_USER != '') && (secrets.DEPLOY_PATH != '' || vars.DEPLOY_PATH != '') }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-journal' \
            backend/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # 6) Applique les migrations et recache la config, côté serveur.
      #    migrate --force ne touche qu'au SCHÉMA, jamais aux données.
      - name: Migrations + cache (sur le serveur)
        if: ${{ (secrets.SSH_PRIVATE_KEY != '' || vars.SSH_PRIVATE_KEY != '') && (secrets.SSH_HOST != '' || vars.SSH_HOST != '') && (secrets.SSH_USER != '' || vars.SSH_USER != '') && (secrets.DEPLOY_PATH != '' || vars.DEPLOY_PATH != '') }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH && \
             php artisan migrate --force && \
             php artisan storage:link || true && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache"
